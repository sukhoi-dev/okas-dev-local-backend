name: Deploy to ECS Fargate

# Auto-deploy the FastAPI backend to ECS Fargate (cluster okas-dev-dev-cluster,
# service okas-dev-api) on every push to main, plus a manual button.
# Mirrors deploy.sh: build -> push to ECR (:latest + commit SHA) -> force a new
# ECS deployment so the service re-pulls the :latest image.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys racing each other.
concurrency:
  group: deploy-ecs
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: okas-cloud-backend
  ECS_CLUSTER: okas-dev-dev-cluster
  ECS_SERVICE: okas-dev-api

jobs:
  deploy:
    name: Build, push, and redeploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build --platform linux/amd64 \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query 'service.deployments[0].status' \
            --output text

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          echo "✓ Deployment complete — service is stable."
